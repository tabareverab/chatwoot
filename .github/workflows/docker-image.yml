name: Build & Push OChat

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'        # corre cuando pusheás un tag v1.0.0-...

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-ochat
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # buildx (multi-arch opcional)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # login a GHCR (no necesita secrets extra)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build & push (usa tu Dockerfile de la raíz)
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64   # o: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

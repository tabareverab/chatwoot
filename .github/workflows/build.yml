name: Build & Push OChat
on:
  push:
    tags: ['v*']    # corre cuando pusheás un tag que empieza con v
  workflow_dispatch:  # también podés correrlo manual desde Actions

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}
          docker build -t $IMAGE .
          docker push $IMAGE
          docker tag $IMAGE ghcr.io/${{ github.repository }}:stable
          docker push ghcr.io/${{ github.repository }}:stable
